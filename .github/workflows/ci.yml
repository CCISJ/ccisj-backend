# Integración continua: en cada PR y en cada push a main, GitHub levanta una
# máquina limpia y corre los mismos chequeos que cada uno corre en su máquina.
# Si alguno falla, el PR aparece en rojo antes de mergearlo.
#
# Existe por #61: entró a main con los 18 archivos de tests sin poder cargar,
# el lint y el build rotos, y SonarCloud igual en verde, porque Sonar analiza
# el código pero no lo compila ni lo ejecuta.
#
# Los tests corren contra un PostgreSQL propio de la máquina de GitHub, igual
# al de docker-compose.test.yml. Nunca contra la base compartida: no hay
# ningún secreto configurado, así que este workflow no tiene cómo llegar a
# Supabase aunque quisiera.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Solo lee el código: no puede escribir en el repo ni comentar en los PR.
permissions:
  contents: read

jobs:
  verificar:
    name: Lint, build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Mismos datos que docker-compose.test.yml, así `TEST_DB_URL` no hace
      # falta configurarla: el valor por omisión ya apunta acá.
      test-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ccisj_test
          POSTGRES_PASSWORD: ccisj_test
          POSTGRES_DB: ccisj_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ccisj_test -d ccisj_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    # Cada acción va fijada al commit exacto y no a una etiqueta como `@v5`:
    # una etiqueta la puede mover su dueño (o quien le robe la cuenta) y la
    # próxima corrida ejecutaría otro código con acceso a este repo. El
    # comentario dice qué versión es ese commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node y pnpm (arriba) en las mismas versiones que el Dockerfile.
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Build (incluye el chequeo de tipos de todo el repo)
        run: pnpm build

      - name: Preparar la base de pruebas (migraciones y seed)
        run: pnpm test:db:prepare

      - name: Tests (con cobertura)
        run: pnpm test:coverage

      # SonarCloud no puede mostrar la cobertura: su "Automatic Analysis" no
      # ejecuta tests y recibirla desde acá exige un token. Así queda a la
      # vista en cada corrida, en el resumen del job, sin ningún secreto.
      - name: Resumen de cobertura
        run: |
          node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const fila = (nombre, k) => '| ' + nombre + ' | ' + t[k].pct + ' % | ' + t[k].covered + ' de ' + t[k].total + ' |';
          console.log([
            '## Cobertura de los tests', '',
            '| | % | Cubiertas |', '|---|---|---|',
            fila('Sentencias', 'statements'), fila('Ramas', 'branches'),
            fila('Funciones', 'functions'), fila('Líneas', 'lines'),
          ].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
