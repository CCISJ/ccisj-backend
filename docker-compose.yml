services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccisj-backend
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ccisj-frontend
    ports:
      - '5173:5173'
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
