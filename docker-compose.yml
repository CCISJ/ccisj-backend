services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccisj-backend
    env_file:
      - .env
    ports:
      - '3000:3000'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: ./node_modules/.bin/tsx watch src/server.ts
    restart: unless-stopped

  # El frontend se busca en ../frontend. Si se clonó con el nombre de GitHub,
  # agregar FRONTEND_DIR=../ccisj-frontend al .env de este repo.
  frontend:
    build:
      context: ${FRONTEND_DIR:-../frontend}
      dockerfile: Dockerfile
    container_name: ccisj-frontend
    env_file:
      - ${FRONTEND_DIR:-../frontend}/.env
    ports:
      - '5173:5173'
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '500'
    volumes:
      - ${FRONTEND_DIR:-../frontend}/src:/app/src
    command: ./node_modules/.bin/vite --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped
