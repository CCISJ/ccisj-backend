# SonarCloud: analisis estatico de seguridad (SAST) del backend.
#
# Es gratis porque el repositorio es publico. Complementa a oxlint, que corre
# local en segundos y mira un archivo a la vez: Sonar sigue el recorrido de un
# dato desde donde entra (req.body, req.query) hasta donde se usa, y con eso
# detecta inyecciones y filtrados que una regla por archivo no puede ver.
#
# Si al crear el proyecto SonarCloud muestra una clave distinta a la de abajo,
# hay que corregir esta linea: el analisis falla si no coincide.
sonar.organization=ccisj
sonar.projectKey=CCISJ_ccisj-backend
sonar.projectName=ccisj-backend

sonar.sources=src
sonar.tests=tests

# Codigo que no escribimos nosotros o que no tiene sentido analizar.
sonar.exclusions=src/generated/**,dist/**,coverage/**

# Cobertura. La genera "pnpm test:coverage". Ojo: solo la lee el scanner
# desde un CI; hoy corre el "Automatic Analysis", que no ejecuta tests ni lee
# este archivo, asi que Sonar no la muestra. Esta en el resumen de cada
# corrida del CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
