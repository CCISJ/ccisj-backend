# Configuración del análisis AUTOMÁTICO de SonarCloud (el que corre en cada PR).
#
# El análisis automático lee este archivo y NO lee sonar-project.properties:
# por eso las exclusiones de ahí no se aplicaban y el cliente de Prisma
# generado (src/generated, miles de líneas casi idénticas) contaba como código
# nuevo y duplicado. Cada modelo nuevo en schema.prisma hacía fallar el
# Quality Gate por duplicación.

sonar.sources=src
sonar.tests=tests

sonar.exclusions=src/generated/**,dist/**,coverage/**
sonar.cpd.exclusions=src/generated/**

sonar.sourceEncoding=UTF-8
